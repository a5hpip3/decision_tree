<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DecisionTree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#F4F0E8; }
  * { box-sizing:border-box; }
  ::selection { background:#E7D9C6; }
  input, button { font:inherit; }

  #app {
    display:grid; grid-template-columns:270px 1fr;
    height:100vh; width:100%; overflow:hidden;
    background:#F4F0E8; color:#1C1917;
    font-family:'IBM Plex Mono', ui-monospace, monospace;
  }

  .om-scroll::-webkit-scrollbar { width:9px; height:9px; }
  .om-scroll::-webkit-scrollbar-thumb {
    background:#DDD4C4; border-radius:9px; border:3px solid transparent; background-clip:content-box;
  }
  .om-scroll::-webkit-scrollbar-track { background:transparent; }

  @keyframes omFade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  @keyframes omSlide { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }

  aside { border-right:1px solid #E2DACD; background:#F9F6F0; display:flex; flex-direction:column; overflow:hidden; }
  .rail-head { padding:20px 20px 16px; border-bottom:1px solid #E2DACD; }
  .brand { font-family:Newsreader, serif; font-size:19px; letter-spacing:-.01em; }
  .kicker { margin-top:5px; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:#9A9288; }
  .sec { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#9A9288; }

  .search { width:100%; padding:8px 10px; font-size:11.5px; background:#FFFDF9;
            border:1px solid #DED5C6; border-radius:2px; color:#1C1917; outline:none; }
  .search:focus { border-color:#C9B79E; }

  .proj { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:3px;
          cursor:pointer; border-left:2px solid transparent; }
  .proj:hover { background:#F1EBE0; }
  .proj-name { flex:1; font-family:Newsreader, serif; font-size:14px; line-height:1.25; }
  .proj-count { font-size:9.5px; color:#9A9288; }

  .chip { display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:2px;
          cursor:pointer; font-size:9.5px; letter-spacing:.06em; user-select:none; }
  .dot { width:6px; height:6px; border-radius:50%; }
  .swatch { width:7px; height:7px; }

  .cluster-row { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:3px; cursor:pointer; }
  .cluster-row:hover { background:#F1EBE0; }

  /* Height is fixed at the 96px the force layout reserves. Real summaries are
     paragraphs, not the design's one-liners, so an auto-height card overlaps
     its neighbours — the full text is in the panel. */
  .node {
    position:absolute; width:214px; height:96px; padding:10px 12px; background:#FFFDF9;
    border-radius:3px; cursor:grab; overflow:hidden; user-select:none;
    transition:box-shadow .15s, border-color .15s, opacity .15s;
  }
  .node:hover { box-shadow:0 6px 18px rgba(28,25,23,.10); z-index:3; }
  .node.dragging { cursor:grabbing; box-shadow:0 14px 34px rgba(28,25,23,.18); z-index:4; }
  .node-meta { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .tag { font-size:8px; letter-spacing:.12em; padding:2px 4px; border:1px solid #E2DACD;
         border-radius:2px; color:#8A8279; flex:none; }
  .node-title {
    font-family:Newsreader, serif; font-size:13.5px; line-height:1.3; color:#1C1917;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;
  }
  .node-cluster { margin-top:6px; display:flex; align-items:center; gap:6px; }

  /* An orb is ~1/40th the area of a card, which is what lets the edges and
     cluster regions underneath actually be seen. */
  .orb {
    position:absolute; border-radius:50%; cursor:grab;
    box-shadow:0 0 0 3px rgba(244,240,232,.9);
    transition:transform .14s ease, box-shadow .14s ease, opacity .14s ease;
  }
  .orb:hover { transform:scale(1.35); z-index:3; }
  .orb.dim { opacity:.45; }
  .orb.selected {
    box-shadow:0 0 0 3px rgba(244,240,232,.9), 0 0 0 5px #A85C3A;
    transform:scale(1.2);
  }
  .orb.dragging { cursor:grabbing; }

  .orb-label {
    position:absolute; width:180px; text-align:center; pointer-events:none;
    font-family:Newsreader, serif; font-size:11.5px; line-height:1.25; color:#4A443D;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
    /* Paper-coloured halo so a label stays readable where it crosses an edge. */
    text-shadow:0 0 4px #F4F0E8, 0 0 4px #F4F0E8, 0 0 8px #F4F0E8;
  }

  .cluster-label {
    position:absolute; width:220px; text-align:center; pointer-events:none;
    font-size:10px; letter-spacing:.18em; text-transform:uppercase; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:7px;
    text-shadow:0 0 5px #F4F0E8, 0 0 10px #F4F0E8;
  }
  .cluster-count {
    font-size:9px; letter-spacing:.04em; opacity:.6;
    border:1px solid currentColor; border-radius:8px; padding:0 5px; line-height:1.5;
  }

  /* Hover card: the text a card used to show, on demand. */
  .pop {
    position:absolute; z-index:6; width:236px; padding:10px 12px 11px;
    background:#FFFDF9; border:1px solid #DED5C6; border-radius:4px;
    box-shadow:0 10px 26px rgba(28,25,23,.14);
    pointer-events:none; transform-origin:50% 100%;
    animation:popIn .13s cubic-bezier(.2,.8,.3,1) both;
  }
  .pop-meta { display:flex; align-items:center; font-size:8.5px; margin-bottom:6px; }
  .pop-title { font-family:Newsreader, serif; font-size:13.5px; line-height:1.3; color:#1C1917; }
  @keyframes popIn {
    from { opacity:0; transform:scale(.94) translateY(3px); }
    to   { opacity:1; transform:none; }
  }

  .node.selected { box-shadow:0 8px 22px rgba(28,25,23,.13); }

  .panel {
    position:absolute; top:0; right:0; bottom:0; width:414px; background:#F9F6F0;
    border-left:1px solid #E2DACD; overflow-y:auto; animation:omSlide .18s ease both; z-index:5;
  }
  .panel-sec { font-size:8.5px; letter-spacing:.13em; text-transform:uppercase; color:#A0988E; margin-bottom:7px; }
  /* Reasoning and excerpts carry file paths, identifiers and stack-ish text
     with no spaces to break on; without this they run past the panel edge. */
  .quote { font-family:Newsreader, serif; font-style:italic; font-size:13.5px; line-height:1.45;
           color:#3A342E; border-left:2px solid #DCC9AE; padding-left:9px;
           white-space:pre-wrap; overflow-wrap:anywhere; }
  .prose { font-size:12px; line-height:1.62; color:#4A443D;
           white-space:pre-wrap; overflow-wrap:anywhere; }

  .zoom-btn { width:26px; height:26px; display:flex; align-items:center; justify-content:center;
              border:1px solid #DED5C6; background:#FFFDF9; border-radius:2px; cursor:pointer;
              font-size:13px; color:#4A443D; user-select:none; }
  .zoom-btn:hover { background:#F4EFE6; }

  .link { font-size:11px; color:#A85C3A; cursor:pointer; }
  .link:hover { text-decoration:underline; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/app.js"></script>
</body>
</html>

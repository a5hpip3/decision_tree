<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DecisionTree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root, :root[data-theme="light"] {
    --canvas:#F4F0E8; --rail:#F9F6F0; --surface:#FFFDF9;
    --selected:#F1E9DC; --hover:#F1EBE0;
    --line:#E2DACD; --line-soft:#E7E0D4; --line-strong:#DED5C6;
    --scroll:#DDD4C4; --quote-bar:#DCC9AE; --focus:#C9B79E; --selection:#E7D9C6;
    --ink:#1C1917; --ink-2:#4A443D;
    --muted:#9A9288; --muted-2:#A9A198; --muted-3:#B5ADA3;
    --accent:#A85C3A; --ok:#3F7A5C;
    --edge:#B9AC97; --edge-strong:#C0AE93;
    --hull-fill:.07; --hull-stroke:.22;
    --cluster-0:#9E6046; --cluster-1:#3F7A5C; --cluster-2:#5A6FA8;
    --cluster-3:#90588C; --cluster-4:#7A7233; --cluster-5:#2C7C88;
    --shadow:var(--shadow); --shadow-soft:var(--shadow-soft);
    color-scheme: light;
  }

  /* Warm dark rather than neutral grey — the paper character is the identity,
     and a cold grey makes the terracotta accent read as an error state. Hulls
     need more fill on dark because a 7% tint disappears against near-black. */
  :root[data-theme="dark"] {
    --canvas:#15140F; --rail:#1B1915; --surface:#221F19;
    --selected:#2C251C; --hover:#252119;
    --line:#302B23; --line-soft:#282419; --line-strong:#3B352C;
    --scroll:#3B352C; --quote-bar:#5C4C34; --focus:#7A6647; --selection:#4A3B27;
    --ink:#EDE7DA; --ink-2:#BDB4A5;
    --muted:#8B8377; --muted-2:#736C62; --muted-3:#5F594F;
    --accent:#D08258; --ok:#63A77F;
    --edge:#443E35; --edge-strong:#5A5142;
    --hull-fill:.13; --hull-stroke:.30;
    --cluster-0:#C9805F; --cluster-1:#5FA87F; --cluster-2:#8296D6;
    --cluster-3:#BC85B6; --cluster-4:#A99C4E; --cluster-5:#4FA6B4;
    --shadow:rgba(0,0,0,.55); --shadow-soft:rgba(0,0,0,.4);
    color-scheme: dark;
  }

  html, body { margin:0; padding:0; height:100%; background:var(--canvas); }
  * { box-sizing:border-box; }
  ::selection { background:var(--selection); }
  input, button { font:inherit; }

  #app {
    display:grid; grid-template-columns:270px 1fr;
    height:100vh; width:100%; overflow:hidden;
    background:var(--canvas); color:var(--ink);
    font-family:'IBM Plex Mono', ui-monospace, monospace;
  }

  .om-scroll::-webkit-scrollbar { width:9px; height:9px; }
  .om-scroll::-webkit-scrollbar-thumb {
    background:var(--scroll); border-radius:9px; border:3px solid transparent; background-clip:content-box;
  }
  .om-scroll::-webkit-scrollbar-track { background:transparent; }

  @keyframes omFade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  @keyframes omSlide { from { opacity:0; transform:translateX(14px); } to { opacity:1; transform:none; } }

  aside { border-right:1px solid var(--line); background:var(--rail); display:flex; flex-direction:column; overflow:hidden; }
  .rail-head { padding:20px 20px 16px; border-bottom:1px solid var(--line); }
  .brand { font-family:Newsreader, serif; font-size:19px; letter-spacing:-.01em; }
  .kicker { margin-top:5px; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .sec { font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }

  .search { width:100%; padding:8px 10px; font-size:11.5px; background:var(--surface);
            border:1px solid var(--line-strong); border-radius:2px; color:var(--ink); outline:none; }
  .search:focus { border-color:var(--focus); }

  .proj { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:3px;
          cursor:pointer; border-left:2px solid transparent; }
  .proj:hover { background:var(--hover); }
  .proj-name { flex:1; font-family:Newsreader, serif; font-size:14px; line-height:1.25; }
  .proj-count { font-size:9.5px; color:var(--muted); }

  .chip { display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:2px;
          cursor:pointer; font-size:9.5px; letter-spacing:.06em; user-select:none; }
  .dot { width:6px; height:6px; border-radius:50%; }
  .swatch { width:7px; height:7px; }

  .cluster-row { display:flex; align-items:center; gap:9px; padding:6px 8px; border-radius:3px; cursor:pointer; }
  .cluster-row:hover { background:var(--hover); }

  /* Height is fixed at the 96px the force layout reserves. Real summaries are
     paragraphs, not the design's one-liners, so an auto-height card overlaps
     its neighbours — the full text is in the panel. */
  .node {
    position:absolute; width:214px; height:96px; padding:10px 12px; background:var(--surface);
    border-radius:3px; cursor:grab; overflow:hidden; user-select:none;
    transition:box-shadow .15s, border-color .15s, opacity .15s;
  }
  .node:hover { box-shadow:0 6px 18px var(--shadow-soft); z-index:3; }
  .node.dragging { cursor:grabbing; box-shadow:0 14px 34px var(--shadow-soft); z-index:4; }
  .node-meta { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .tag { font-size:8px; letter-spacing:.12em; padding:2px 4px; border:1px solid var(--line);
         border-radius:2px; color:var(--muted); flex:none; }
  .node-title {
    font-family:Newsreader, serif; font-size:13.5px; line-height:1.3; color:var(--ink);
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;
  }
  .node-cluster { margin-top:6px; display:flex; align-items:center; gap:6px; }

  /* An orb is ~1/40th the area of a card, which is what lets the edges and
     cluster regions underneath actually be seen. */
  .orb {
    position:absolute; border-radius:50%; cursor:grab;
    box-shadow:0 0 0 3px var(--canvas);
    transition:transform .14s ease, box-shadow .14s ease, opacity .14s ease;
  }
  .orb:hover { transform:scale(1.35); z-index:3; }
  .orb.dim { opacity:.45; }
  .orb.selected {
    box-shadow:0 0 0 3px var(--canvas), 0 0 0 5px var(--accent);
    transform:scale(1.2);
  }
  .orb.dragging { cursor:grabbing; }

  .orb-label {
    position:absolute; width:180px; text-align:center; pointer-events:none;
    font-family:Newsreader, serif; font-size:11.5px; line-height:1.25; color:var(--ink-2);
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
    /* Paper-coloured halo so a label stays readable where it crosses an edge. */
    text-shadow:0 0 4px var(--canvas), 0 0 4px var(--canvas), 0 0 8px var(--canvas);
  }

  .cluster-label {
    position:absolute; width:220px; text-align:center; pointer-events:none;
    font-size:10px; letter-spacing:.18em; text-transform:uppercase; font-weight:500;
    display:flex; align-items:center; justify-content:center; gap:7px;
    text-shadow:0 0 5px var(--canvas), 0 0 10px var(--canvas);
  }
  .cluster-count {
    font-size:9px; letter-spacing:.04em; opacity:.6;
    border:1px solid currentColor; border-radius:8px; padding:0 5px; line-height:1.5;
  }

  /* Hover card: the text a card used to show, on demand. */
  .pop {
    position:absolute; z-index:6; width:236px; padding:10px 12px 11px;
    background:var(--surface); border:1px solid var(--line-strong); border-radius:4px;
    box-shadow:0 10px 26px var(--shadow);
    pointer-events:none; transform-origin:50% 100%;
    animation:popIn .13s cubic-bezier(.2,.8,.3,1) both;
  }
  .pop-meta { display:flex; align-items:center; font-size:8.5px; margin-bottom:6px; }
  .pop-title { font-family:Newsreader, serif; font-size:13.5px; line-height:1.3; color:var(--ink); }
  @keyframes popIn {
    from { opacity:0; transform:scale(.94) translateY(3px); }
    to   { opacity:1; transform:none; }
  }

  .node.selected { box-shadow:0 8px 22px rgba(28,25,23,.13); }

  .panel {
    position:absolute; top:0; right:0; bottom:0; width:414px; background:var(--rail);
    border-left:1px solid var(--line); overflow-y:auto; animation:omSlide .18s ease both; z-index:5;
  }
  .panel-sec { font-size:8.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; }
  /* Reasoning and excerpts carry file paths, identifiers and stack-ish text
     with no spaces to break on; without this they run past the panel edge. */
  .quote { font-family:Newsreader, serif; font-style:italic; font-size:13.5px; line-height:1.45;
           color:var(--ink-2); border-left:2px solid var(--quote-bar); padding-left:9px;
           white-space:pre-wrap; overflow-wrap:anywhere; }
  .prose { font-size:12px; line-height:1.62; color:var(--ink-2);
           white-space:pre-wrap; overflow-wrap:anywhere; }

  .zoom-btn { width:26px; height:26px; display:flex; align-items:center; justify-content:center;
              border:1px solid var(--line-strong); background:var(--surface); border-radius:2px; cursor:pointer;
              font-size:13px; color:var(--ink-2); user-select:none; }
  .zoom-btn:hover { background:var(--hover); }

  .theme-toggle {
    cursor:pointer; font-size:13px; line-height:1; color:var(--muted);
    padding:2px 5px; border-radius:3px; user-select:none;
  }
  .theme-toggle:hover { color:var(--ink-2); background:var(--hover); }

  .link { font-size:11px; color:var(--accent); cursor:pointer; }
  .link:hover { text-decoration:underline; }
</style>
<script>
  // Inline and before paint: applying the theme from app.js would flash the
  // light background first on a dark-mode machine.
  (function () {
    try {
      var saved = localStorage.getItem('decisiontree:theme');
      if (saved !== 'light' && saved !== 'dark') {
        saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', saved);
    } catch (e) { /* leave the default */ }
  })();
</script>
</head>
<body>
<div id="app"></div>
<script src="/static/app.js"></script>
</body>
</html>
